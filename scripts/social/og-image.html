<!doctype html>
<!--
  Source for public/og-image.png (1200×630 link-preview image).
  Regenerate after changing it: npm run og-image (requires Microsoft Edge or Chrome).
  Colours and type follow DESIGN.md (Trail Map).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Barlow Semi Condensed';
        src: url('../../node_modules/@fontsource/barlow-semi-condensed/files/barlow-semi-condensed-latin-700-normal.woff2')
          format('woff2');
        font-weight: 700;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 60px 72px;
        background: #f5f7f4;
        color: #12211c;
        font-family: 'Geist', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .topo {
        position: absolute;
        inset: 0;
        background-color: rgb(45 106 79 / 0.2);
        -webkit-mask: url('../../public/topo.svg') center / cover no-repeat;
        mask: url('../../public/topo.svg') center / cover no-repeat;
      }
      .fade {
        position: absolute;
        inset: 0;
        -webkit-mask: radial-gradient(70% 80% at 85% 25%, #000 15%, transparent 75%);
        mask: radial-gradient(70% 80% at 85% 25%, #000 15%, transparent 75%);
      }
      .ridges {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 190px;
      }
      .brand {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 24px;
        font-weight: 600;
      }
      .brand span {
        color: #41524b;
        font-weight: 400;
      }
      .kicker {
        position: relative;
        margin-top: 44px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: 'Geist Mono', monospace;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #41524b;
      }
      .blaze {
        width: 10px;
        height: 18px;
        border-radius: 2px;
        background: #e07b39;
      }
      h1 {
        position: relative;
        margin-top: 14px;
        font-family: 'Barlow Semi Condensed', sans-serif;
        font-size: 92px;
        line-height: 0.98;
        font-weight: 700;
        text-transform: uppercase;
      }
      h1 span {
        display: block;
        color: #2d6a4f;
        text-transform: none;
        font-size: 74px;
      }
      ul {
        position: relative;
        margin-top: 34px;
        display: flex;
        gap: 10px;
        padding: 0;
        list-style: none;
      }
      li {
        padding: 8px 14px;
        border-radius: 9999px;
        background: #ffffff;
        border: 1px solid #dce4de;
        font-family: 'Geist Mono', monospace;
        font-size: 18px;
        font-weight: 500;
        color: #41524b;
      }
      li.accent {
        background: #2d6a4f;
        border-color: #2d6a4f;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="fade"><div class="topo"></div></div>
    <svg class="ridges" viewBox="0 0 1440 240" preserveAspectRatio="none" aria-hidden="true">
      <path id="r0" fill="rgb(59 139 181 / 0.14)" />
      <path id="r1" fill="rgb(45 106 79 / 0.16)" />
      <path id="r2" fill="rgb(45 106 79 / 0.26)" />
    </svg>
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#2d6a4f" />
        <path
          d="M9.5 23.5 16 8.5l6.5 15"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M12.2 18.2h7.6"
          fill="none"
          stroke="#e07b39"
          stroke-width="2.6"
          stroke-linecap="round"
        />
      </svg>
      Andi Muhammad Aqil <span>· Selangor, Malaysia</span>
    </div>
    <p class="kicker"><span class="blaze"></span>Full-stack · Front end to back end</p>
    <h1>Software Engineer <span>building practical digital products.</span></h1>
    <ul>
      <li class="accent">Software Engineer at MTechnix</li>
      <li>React</li>
      <li>Express.js</li>
      <li>PostgreSQL</li>
      <li>Azure</li>
    </ul>
    <script>
      // Same ridgelines as app/components/fx/ridges.tsx.
      function ridge(seed, base, amplitude) {
        const points = [];
        for (let x = 0; x <= 1440; x += 16) {
          const t = x / 1440;
          const y =
            base -
            amplitude *
              (0.55 * Math.sin(t * Math.PI * (2.2 + seed * 0.3) + seed) +
                0.3 * Math.sin(t * Math.PI * (5.1 + seed) + seed * 2.1) +
                0.15 * Math.sin(t * Math.PI * (11.3 + seed * 2) + seed * 3.7));
          points.push(x + ' ' + y.toFixed(1));
        }
        return 'M0 240L' + points.join('L') + 'L1440 240Z';
      }
      document.getElementById('r0').setAttribute('d', ridge(1.3, 110, 70));
      document.getElementById('r1').setAttribute('d', ridge(2.1, 150, 55));
      document.getElementById('r2').setAttribute('d', ridge(3.4, 190, 38));
    </script>
  </body>
</html>
