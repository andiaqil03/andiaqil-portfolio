<!doctype html>
<!--
  Source for public/og-image.png (1200×630 link-preview image).
  Regenerate after changing it: npm run og-image (requires Microsoft Edge or Chrome).
  Colours and type follow DESIGN.md.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 64px 72px;
        background: #f7f8f7;
        color: #0e1411;
        font-family: 'Geist', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgb(14 20 17 / 0.12) 1px, transparent 1.2px);
        background-size: 22px 22px;
        mask-image: radial-gradient(80% 90% at 85% 20%, #000 20%, transparent 70%);
      }
      .brand {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 24px;
        font-weight: 600;
      }
      .brand span {
        color: #69716b;
        font-weight: 400;
      }
      h1 {
        position: relative;
        margin-top: 56px;
        font-size: 74px;
        line-height: 1.04;
        letter-spacing: -0.035em;
        font-weight: 600;
      }
      h1 span {
        display: block;
        color: #4a524d;
      }
      p {
        position: relative;
        margin-top: 24px;
        max-width: 820px;
        font-size: 24px;
        line-height: 1.5;
        color: #4a524d;
      }
      ul {
        position: relative;
        margin-top: auto;
        display: flex;
        gap: 10px;
        padding: 0;
        list-style: none;
      }
      li {
        padding: 8px 14px;
        border-radius: 8px;
        background: #ffffff;
        border: 1px solid #e4e7e4;
        font-family: 'Geist Mono', monospace;
        font-size: 18px;
        font-weight: 500;
        color: #4a524d;
      }
      li.accent {
        background: #e7f4ee;
        border-color: #e7f4ee;
        color: #0e7a55;
      }
    </style>
  </head>
  <body>
    <div class="dots"></div>
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="6" fill="#0e1411" />
        <path
          d="M9.5 23.5 16 8.5l6.5 15"
          fill="none"
          stroke="#f7f8f7"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M12.2 18.2h7.6"
          fill="none"
          stroke="#5cc594"
          stroke-width="2.6"
          stroke-linecap="round"
        />
      </svg>
      Andi Aqil <span>· Selangor, Malaysia</span>
    </div>
    <h1>Software Engineer <span>building practical digital products.</span></h1>
    <p>Backend development, REST APIs and full-stack web applications.</p>
    <ul>
      <li class="accent">Freelance Software Developer</li>
      <li>NestJS</li>
      <li>Angular</li>
      <li>React</li>
      <li>Laravel</li>
      <li>.NET</li>
    </ul>
  </body>
</html>
